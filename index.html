<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#006a4e">
  <title>Bangladesh Explorer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="brand" onclick="showPage('home')">
        <div class="brand-mark">🇧🇩</div>
        <div><strong>Bangladesh Explorer</strong><small>জ্ঞান • মানচিত্র • ভ্রমণ</small></div>
      </div>
      <div class="top-actions">
        <button class="icon-btn" onclick="toggleTheme()" title="থিম">🌙</button>
        <button class="admin-btn" onclick="openAdmin()">⚙️ Admin</button>
      </div>
    </header>

    <main id="main"></main>

    <nav class="bottom-nav">
      <button onclick="showPage('home')">🏠<span>হোম</span></button>
      <button onclick="showPage('map')">🗺️<span>ম্যাপ</span></button>
      <button onclick="showPage('districts')">📍<span>জেলা</span></button>
      <button onclick="showPage('search')">🔎<span>খুঁজুন</span></button>
      <button onclick="showPage('more')">☰<span>আরও</span></button>
    </nav>
  </div>

  <div id="modal" class="modal hidden"></div>
  <script src="script.js"></script>
</body>
</html>
